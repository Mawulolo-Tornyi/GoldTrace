project:
  name: GoldTrace
  version: 0.2.0
  timezone: UTC

sampling:
  audio_rate: 16000
  vibration_rate: 1000
  audio_window_seconds: 2.0
  vibration_window_seconds: 2.0
  rolling_windows_seconds: [1, 5, 10, 30, 60]
  synchronization_tolerance_seconds: 3.0
  stale_packet_seconds: 30.0

sensors:
  turbidity_min_ntu: 0.0
  turbidity_max_ntu: 5000.0
  temperature_min_c: 0.0
  temperature_max_c: 60.0
  battery_low_voltage: 10.8
  rssi_degraded_dbm: -105
  max_audio_samples: 64000
  max_vibration_samples: 10000

risk:
  turbidity_difference_high: 25.0
  turbidity_difference_critical: 50.0
  machine_probability_high: 0.70
  vibration_probability_high: 0.70
  fusion_probability_high: 0.65
  critical_persistence_seconds: 20.0
  high_persistence_seconds: 10.0
  confidence_minimum: 0.45
  uncertain_sensor_fraction: 0.50

alerts:
  cooldown_seconds: 300
  minimum_risk: HIGH

agency_alerts:
  enabled: true
  production_mode: false
  dispatch_mode: DEMO
  dispatch_threshold: CRITICAL
  minimum_confidence: 0.85
  minimum_agreeing_sensors: 3
  minimum_persistence_seconds: 30
  require_location: true
  cooldown_seconds: 300
  max_retries: 3
  retry_intervals_seconds: [30, 120, 300]
  agencies_file: config/agencies.example.yaml

sim7600:
  serial_port: /dev/ttyUSB2
  baudrate: 115200
  timeout_seconds: 8

maps:
  map_link_provider: openstreetmap
  default_zoom: 15

nodes:
  file: config/nodes.example.yaml

rivers:
  file: config/rivers.example.geojson

baseline:
  alpha: 0.02
  guarded_update_max_risk: LOW
  minimum_samples: 30

models:
  registry: models/model_registry.json
  audio_classical: models/goldtrace_audio_classical_v1.joblib
  audio_torch: models/checkpoints/goldtrace_audio_v1.pt
  audio_onnx: models/edge/goldtrace_audio_v1.onnx
  vibration_classical: models/goldtrace_vibration_classical_v1.joblib
  vibration_torch: models/checkpoints/goldtrace_vibration_v1.pt
  vibration_onnx: models/edge/goldtrace_vibration_v1.onnx
  environment: models/goldtrace_environment_v1.joblib
  anomaly: models/goldtrace_anomaly_v1.joblib
  fusion: models/goldtrace_fusion_v1.joblib

database:
  path: data/goldtrace.db

logging:
  level: INFO
  max_bytes: 5000000
  backup_count: 3

api:
  host: 0.0.0.0
  port: 8000
  max_payload_bytes: 2000000

edge:
  preferred_runtime: onnxruntime
  providers: [CPUExecutionProvider]
