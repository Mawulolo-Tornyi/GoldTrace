[platformio]
default_envs = node_a

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

lib_deps =
    jgromes/RadioLib
    adafruit/Adafruit ADS1X15
    adafruit/Adafruit BusIO
    milesburton/DallasTemperature
    paulstoffregen/OneWire
    mikalhart/TinyGPSPlus
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:node_a]
extends = env

build_flags =
    ${env.build_flags}
    -DNODE_ID=\"NODE_A\"

[env:node_b]
extends = env

build_flags =
    ${env.build_flags}
    -DNODE_ID=\"NODE_B\"
